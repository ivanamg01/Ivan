<div id="root"></div>
<script>
  function showDiag(msg) {
    var root = document.getElementById('root');
    if (root) {
      root.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#B3432B;background:#FBEAE6;min-height:100vh;box-sizing:border-box;"><h2 style="margin-top:0;">No se pudo cargar la app</h2><pre style="white-space:pre-wrap;font-size:13px;line-height:1.5;">' + String(msg).replace(/</g, '&lt;') + '</pre></div>';
    }
  }
  window.addEventListener('error', function (e) {
    var parts = [];
    parts.push('Mensaje: ' + (e.message || 'sin mensaje'));
    if (e.filename) parts.push('Archivo: ' + e.filename + ':' + e.lineno + ':' + e.colno);
    if (e.error && e.error.stack) parts.push('Stack:\n' + e.error.stack);
    showDiag(parts.join('\n\n'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showDiag('Promise error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  setTimeout(function () {
    var root = document.getElementById('root');
    if (root && !root.hasChildNodes()) {
      showDiag('La app no cargó después de varios segundos.\n\nPuede ser que React o ReactDOM no se pudieron descargar (revisa tu conexión a internet), o que el navegador bloqueó alguno de esos archivos.');
    }
  }, 4000);
</script>

        return new Promise((resolve, reject) => {
            const v = localStorage.getItem('revalua:' + key);
            if (v === null) {
                reject(new Error('not found'));
                return;
            }
            resolve({ key, value: v, shared: false });
        });
    },
    set(key, value) {
        return new Promise((resolve) => {

function resizeImage(file, maxDim = 1024, quality = 0.82) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
        reader.onload = (e) => {
            const img = new Image();
            img.onerror = () => reject(new Error('Imagen no válida'));
            img.onload = () => {
                let width = img.width;
                let height = img.height;
                if (width > height && width > maxDim) {
                    height = Math.round((height * maxDim) / width);
                    width = maxDim;
                }
                else if (height >= width && height > maxDim) {
                    width = Math.round((width * maxDim) / height);
                    height = maxDim;
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}
